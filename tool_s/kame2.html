<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>極簡中文時地相機</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; box-sizing: border-box; }
        video, canvas { width: 100%; max-width: 400px; height: auto; border-radius: 8px; background: #222; }
        #status { font-size: 14px; margin: 8px 0; color: #ff9800; height: 20px; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 18px; font-size: 16px; background: #007aff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        button:disabled { background: #555; color: #aaa; }
        button.active { background: #34c759; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="status">正在取得位置與地址...</div>
    
    <div class="btn-group">
        <button id="switchCameraBtn">切換鏡頭 (後)</button>
        <button id="torchBtn" disabled>手電筒：關</button>
    </div>
    <div class="btn-group">
        <button id="captureBtn" disabled>拍照並加上浮水印</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const torchBtn = document.getElementById('torchBtn');
        const statusDiv = document.getElementById('status');

        let locationText = "定位中...";
        let currentFacingMode = "environment"; // 預設後鏡頭
        let currentStream = null;
        let torchOn = false;

        // 1. 啟動相機
        async function initCamera(facingMode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { facingMode: { exact: facingMode } },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                checkTorchSupport();
            } catch (err) {
                // 若 exact 失敗（部分裝置相機限制），改用一般參數
                try {
                    const fallbackConstraints = {
                        video: { facingMode: facingMode },
                        audio: false
                    };
                    currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    video.srcObject = currentStream;
                    checkTorchSupport();
                } catch (e) {
                    statusDiv.textContent = "無法存取相機，請檢查 Safari 權限或確認使用 HTTPS";
                }
            }
        }

        // 檢查是否支援手電筒（通常僅後鏡頭支援）
        function checkTorchSupport() {
            const track = currentStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                torchBtn.disabled = false;
            } else {
                torchBtn.disabled = true;
                torchBtn.textContent = "不支援手電筒";
                torchOn = false;
            }
        }

        // 切換前後鏡頭
        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            switchCameraBtn.textContent = `切換鏡頭 (${currentFacingMode === "environment" ? "後" : "前"})`;
            torchOn = false;
            torchBtn.textContent = "手電筒：關";
            torchBtn.classList.remove('active');
            initCamera(currentFacingMode);
        });

        // 控制手電筒
        torchBtn.addEventListener('click', async () => {
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            torchOn = !torchOn;
            try {
                await track.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
                torchBtn.textContent = `手電筒：${torchOn ? '開' : '關'}`;
                if (torchOn) {
                    torchBtn.classList.add('active');
                } else {
                    torchBtn.classList.remove('active');
                }
            } catch (err) {
                alert("此裝置或當前鏡頭不支援手電筒控制");
                torchOn = false;
                torchBtn.textContent = "手電筒：關";
            }
        });

        // 2. 取得 GPS 並透過 Nominatim 轉為中文詳細地址
        function getLocationAndAddress() {
            if (!navigator.geolocation) {
                statusDiv.textContent = "您的瀏覽器不支援地理定位";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    statusDiv.textContent = "正在解析中文地址...";

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                            headers: { 'Accept-Language': 'zh-TW,zh;q=0.9' }
                        });
                        const data = await response.json();

                        if (data && data.address) {
                            const addr = data.address;
                            const city = addr.city || addr.county || addr.state || "";
                            const district = addr.suburb || addr.city_district || addr.town || addr.village || "";
                            const road = addr.road || addr.suburb || "";
                            
                            locationText = `${city} ${district} ${road}`.trim();
                            if (!locationText) {
                                locationText = data.display_name;
                            }
                        } else {
                            locationText = `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                        }

                        statusDiv.textContent = `定位成功：${locationText}`;
                        captureBtn.disabled = false;
                    } catch (e) {
                        locationText = `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                        statusDiv.textContent = "地址解析失敗，將以座標代替";
                        captureBtn.disabled = false;
                    }
                },
                (error) => {
                    statusDiv.textContent = "無法取得 GPS 位置，請確認是否有授權";
                    locationText = "未知位置";
                    captureBtn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // 初始化執行
        initCamera(currentFacingMode);
        getLocationAndAddress();

        // 3. 拍照與合成浮水印
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const now = new Date();
            const timeString = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const watermarkText = `${timeString} | ${locationText}`;

            context.font = "bold 32px sans-serif";
            context.fillStyle = "rgba(255, 255, 255, 0.9)";
            context.shadowColor = "rgba(0, 0, 0, 0.9)";
            context.shadowBlur = 8;
            
            context.fillText(watermarkText, 40, canvas.height - 50);

            const dataUrl = canvas.toDataURL('image/jpeg');
            let link = document.createElement('a');
            link.href = dataUrl;
            link.download = `photo_${Date.now()}.jpg`;
            link.click();
        });
    </script>
</body>
</html>
